<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Links</title>
  <style>
    a:link {
      color: blue;
    }
    a:visited {
      color: purple;
    }
    a:hover {
      color: red;
    }
    a:active {
      color: green;
    }
  </style>
</head>
<body>
  <h1>CSS Links Example</h1>
  <a href="https://www.google.com" target="_blank">Visit Google</a>
</body>
</html>
