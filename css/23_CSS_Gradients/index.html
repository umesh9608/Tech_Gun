<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Gradient</title>
<style>
  /* we use both property( background /background-image): */
 
  #div1{
    height: 500px;
    border: 5px solid red;
/* type 1:- -------linear-gradient */

    /* background-image: linear-gradient( green, blue,red); */
    /* default property is top to bottom */
  
    /* left to right , to bottom, 120deg*/
    /* background-image: linear-gradient(160deg, green, blue,red); */


    /* type 2: -----radial-gradient */
    /* default property ellipse */
    /* background-image: radial-gradient( green, blue,red,yellow,pink,orange); */
    background-image: radial-gradient(circle, green 20%, blue 30%,red 50%);
    

  }
</style>
</head>
<body>
  <div id="div1"></div>
</body>
</html>
