<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Conic Gradient</title>
  <style>
    /* 
      ✅ Conic Gradient
      -------------------
      → Creates a color transition around a center point.
      → Syntax: conic-gradient(from angle, color1, color2, ...)
    */

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: conic-gradient(from 0deg, red, yellow, green, blue, red);
    }

    h1 {
      color: white;
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <h1>Conic Gradient Example</h1>
</body>
</html>
