<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Radial Gradient</title>
  <style>
    /* 
      ✅ Radial Gradient
      -------------------
      → Creates a smooth transition from center to edges.
      → Syntax: radial-gradient(shape, color1, color2, ...)
    */

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Circular radial gradient */
      background: radial-gradient(circle, #ff9a9e, #fad0c4);
    }

    h1 {
      color: #333;
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <h1>Radial Gradient Example</h1>
</body>
</html>
