<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css function</title>
  <style>
    :root{
      --primary-color:teal;
      --btn-color:blueviolet;
      --text-color:white;
    }
#fun{
  background-color: var(--primary-color);
  height: 200px;
  width: calc(100% -200px);
}

a{
  padding: 10px 30px;
  margin: 20px;
  background-color: var(--btn-color);
  color: var(--text-color);
  text-decoration: none;
}
  </style>
</head>
<body>
  <!-- css function : css is not a progamming but it accapt function like
   :  rgb(), url(), linear-gradient() etc-->
   <!-- first cal() to calculate
        second var() -->
<div id="fun"></div>
<br><hr>
<a href="https://www.google.com">Google</a>

</body>
</html>
