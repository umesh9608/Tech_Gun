<!DOCTYPE html>
<html>
<head>
<style>
.container {
  background: #ddd;
  padding: 20px;
}
.box {
  position: relative;
  top: 20px;
  left: 30px;
  background: orange;
  padding: 10px;
}
</style>
</head>
<body>
  <div class="container">
    <div class="box">I am relative</div>
  </div>
</body>
</html>

<!-- notes:
 Element is moved relative to its normal position.

Space reserved in the layout remains the same.

Useful for minor adjustments. -->
