<!DOCTYPE html>
<html>
<head>
<style>
.box {
  position: sticky;
  top: 0;
  background: purple;
  padding: 10px;
  color: white;
}
</style>
</head>
<body>
  <div class="box">I am sticky</div>
  <div style="height: 1200px;">Scroll down to test sticky effect</div>
</body>
</html>

<!--  Notes:

Behaves like relative until a certain scroll point.

Then it sticks to the top.

Mostly used for sticky headers and tables. -->
