
  <!-- ye webpage me element ka position define krta h ki kise rhe ga 
   1. static (default) : normal flow
   2. relative: 1. ye apne jagha se calculate krta hia (top,bottom,right,left) 2. ye apne jagha se hattha h jarur but wha pe kise element ko ane nhi deta hia
   3. fixed
   4. absolute :ye apna calculation apne parent se start krta hai or nhi h to body se start kr deta hia
   
   . top
   .bottom
   .left
   .right  ye 4ro kb kaam krega jb position property laga hua ho-->

   <!DOCTYPE html>
<html>
<head>
<style>
.box {
  position: static;
  background: lightblue;
  padding: 10px;
}
</style>
</head>
<body>
  <div class="box">I am static</div>
</body>
</html>

<!-- notes"
 Every element has static position by default.

Cannot use top, left, right, bottom.

Elements are placed normally in the flow. -->
