<!DOCTYPE html>
<html>
<head>
<style>
.box {
  position: fixed;
  top: 10px;
  right: 10px;
  background: red;
  padding: 10px;
  color: white;
}
</style>
</head>
<body>
  <p>Scroll down the page to see the fixed box stay in place.</p>
  <div style="height: 1500px;"></div>
  <div class="box">I am fixed</div>
</body>
</html>
<!--  Notes:

Stays fixed in the same place, even on scroll.

Positioned relative to the viewport.

Commonly used for:

Sticky headers

Navigation bars

Chat buttons -->
