<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Shadow</title>
  <style>
    div{
      border: 2px solid red;
      width: 500px;
      background-color: yellowgreen;
      margin: 100px;
      padding: 20px;
      /*x-axis,y-axis,blur,sprad radious,color value, inset is under the box value */
      /* box-shadow: 10px 10px 15px 3px gray inset; */

      box-shadow: 10px 10px 15px 3px gray inset, -10px 10px 15px 3px rgb(204, 115, 115) ;

    }
  </style>
</head>
<body>
  <div>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Corrupti vero nobis quia sint quae, ipsum officia expedita ad, doloremque atque odit impedit deserunt minus, amet voluptatibus. Delectus amet ex commodi!</p>
  </div>

  <span style="box-shadow: 5px 5px 10px red, -5px -5px 10px blue;
">Lorem ipsum dolor sit amet.</span>
</body>
</html>
