<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Borders</title>
  <style>
    .box {
      width: 200px;
      padding: 10px;
      margin: 10px;
      border: 3px solid red;      /* Solid border */
      border-radius: 10px;        /* Rounded corners */
    }
  </style>
</head>
<body>
  <h1>CSS Borders</h1>
  <div class="box">This is a box with border.</div>
</body>
</html>
