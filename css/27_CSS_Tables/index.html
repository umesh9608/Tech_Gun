<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css tables</title>
  <style>
    table {
      border: 2px solid black;

    /* combine all border using border-collaps */

    /* border-collapse: separate;  this is defalut property */
      border-collapse: collapse;
      /* border-spacing: 15px 25px; */
      /* if any td data is not avalable */
      empty-cells: hide;
    }
    caption{
      border: 2px solid black;
      /* caption-side: bottom; */
    }
    tr{
      /* in tr directly not show border css */
      border: 2px solid black; 
    }
    th{
      border: 2px solid black;
      height: 30px;
      padding: 15px;
      text-align: right;
    }
     td{
      border: 2px solid black;
      height: 55px;
      padding: 5px;
      text-align: right;
      vertical-align: bottom;
    }
    
  </style>
</head>

<body>
  <table>
    <caption>table css</caption>
    <tr>
      <th>heading1</th>
      <th>heading2</th>
      <th>heading3</th>
    </tr>
    <tr>
      <td>content 1</td>
      <td>content 2</td>
      <td>content 3</td>
    </tr>
    <tr>
      <td>content 4</td>
      <td>content 5</td>
      <td>content 6</td>
    </tr>
  </table>
</body>

</html>
