<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Text</title>
  <style>
    p {
      color: darkblue;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      word-spacing: 5px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>CSS Text Example</h1>
  <p>This is a text formatting example using CSS.</p>
</body>
</html>
