<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Colors</title>
  <style>
    h1 {
      color: red;             /* Named color */
    }
    p {
      color: #00ff00;         /* Hex color */
    }
    .rgbText {
      color: rgb(0, 0, 255);  /* RGB color */
    }
    .rgbaText {
      color: rgba(255, 0, 0, 0.5); /* RGBA with opacity */
    }
  </style>
</head>
<body>
  <h1>CSS Colors Example</h1>
  <p>Hex Color Example</p>
  <p class="rgbText">RGB Color Example</p>
  <p class="rgbaText">RGBA Color Example</p>
</body>
</html>
