<!DOCTYPE html>
<html>
<head>
  <style>
    .box {
      width: 100px;
      height: 100px;
      margin: 10px;
      color: white;
      padding: 10px;
    }

    .left {
      float: left;
      background-color: teal;
    }

    .right {
      float: right;
      background-color: orange;
    }

    .clear-both {
      clear: both; /* This element starts below floated elements */
      background-color: purple;
      width: 100%;
      height: 50px;
    }
  </style>
</head>
<body>
  <h2>Clear Example</h2>
  <div class="box left">Float Left</div>
  <div class="box right">Float Right</div>
  <div class="clear-both">I appear below both boxes</div>
</body>
</html>
