<!DOCTYPE html>
<html>
<head>
  <style>
    img {
      float: left; /* Image floats to the left */
      margin-right: 15px; /* Space between image and text */
      width: 150px;
    }

    p {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h2>Float Example</h2>
  <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Nature Image">
  <p>
    This paragraph wraps around the image because the image is floated to the left.
    Floating allows text and inline content to wrap around elements like images.
  </p>
</body>
</html>
