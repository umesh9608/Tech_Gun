<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>opacity</title>
  <style>
    #color-box{
      background-color: green;
      height: 200px;
      width: 500px;
      margin-bottom: 10px;
      opacity: 0.5; /* o mean full transparent and 1 mean no transparent */ 
    }
     img :hover{
      opacity: 0.7;

     }

     #red-box{
      height: 300px;
      width: 200px;
      background-color: red;
      margin-top: -100px;
      opacity: 0.5;
     }
  </style>
</head>
<body>

  <div id="color-box"></div>
  <div id="red-box"></div>
</body>
</html>
