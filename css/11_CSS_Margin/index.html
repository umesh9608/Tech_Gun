<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Margins</title>
  <style>
    .box {
      background-color: lightgreen;
      margin: 30px auto;
      padding: 10px;
      width: 250px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>CSS Margins</h1>
  <div class="box">This box is centered using margin.</div>
</body>
</html>
