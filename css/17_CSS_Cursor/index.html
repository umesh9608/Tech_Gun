<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Cursor Example</title>
  <style>
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }

    .default { cursor: default; }
    .pointer { cursor: pointer; }
    .text    { cursor: text; }
    .move    { cursor: move; }
    .wait    { cursor: wait; }
    .help    { cursor: help; }
    .cross   { cursor: crosshair; }
    .zoom-in { cursor: zoom-in; }
    .zoom-out { cursor: zoom-out; }
    .grab    { cursor: grab; }
    .grabbing { cursor: grabbing; }
  </style>
</head>
<body>
  <h1>CSS Cursor Demo</h1>
  <button class="default">Default</button>
  <button class="pointer">Pointer</button>
  <button class="text">Text</button>
  <button class="move">Move</button>
  <button class="wait">Wait</button>
  <button class="help">Help</button>
  <button class="cross">Crosshair</button>
  <button class="zoom-in">Zoom In</button>
  <button class="zoom-out">Zoom Out</button>
  <button class="grab">Grab</button>
  <button class="grabbing">Grabbing</button>
</body>
</html>
